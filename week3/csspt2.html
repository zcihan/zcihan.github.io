<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Week3 Card Homework</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        .card{
            width: 500px;
            height: 750px;
            padding: 36px;
            margin-bottom: 12px;
            background-color: #5fbded; 
            box-shadow: 5px 10px #888888;
        }
        .card h1{
            font-family: "Alfa Slab One", serif;
            color: #2c576d;
        }
        .card p{
            font-family: "Roboto", sans-serif;
            font-size: 18px;
            color:#1d3a49;
        }
        .card button{
            padding:10px 20px;
            font-family: "Roboto", sans-serif;
            background-color:#2c576d;
            color:white;
            border:none;
            border-radius:4px;
        }
    
        .image-container {
            width: 200px;
            height: 300px;
            border: 1px solid black;
            margin-bottom: 25px;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Cihan's Card</h1>
        <div class="image-container">
          
            <img src='asset/csscreature.jpg' alt="photo">
        </div>
        <p>I am Cihan Zhang, a second-year Media Art and Science student at ASU Herberger Institute. I enjoy interactive web design and digital art.</p>
        <button onclick="window.open('https://asu.edu','_blank')">Visit ASU</button>
    </div>
</body>
</html>
